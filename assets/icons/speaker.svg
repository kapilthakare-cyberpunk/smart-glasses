<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge background -->
  <circle cx="70" cy="70" r="60" fill="#FFFFFF"/>
  <circle cx="70" cy="70" r="59.5" fill="none" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Speaker cone (trapezoid) -->
  <path d="M40,40 L40,100 L62,96 L84,100 L84,40 L62,44 Z"
        fill="#1F2937"/>

  <!-- Speaker grille (horizontal lines) -->
  <line x1="50" y1="48" x2="74" y2="48" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="50" y1="58" x2="74" y2="58" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="52" y1="68" x2="72" y2="68" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="52" y1="78" x2="72" y2="78" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Sound waves (arcs radiating from right side) -->
  <path d="M 74 42 A 10 10 0 0 1 74 98" fill="none" stroke="#0080FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 84 34 A 18 18 0 0 1 84 106" fill="none" stroke="#0080FF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 94 26 A 26 26 0 0 1 94 114" fill="none" stroke="#0080FF" stroke-width="1.3" stroke-linecap="round"/>
</svg>
